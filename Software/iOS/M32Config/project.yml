# XcodeGen spec — generates M32Config.xcodeproj from these sources.
#
#   brew install xcodegen
#   cd Software/iOS/M32Config && ./sync-webtool.sh && xcodegen generate
#
# The generated .xcodeproj is NOT checked in -- the repo-root .gitignore covers
# it: it is derived, and regenerating it is a one-line command. If you prefer to
# create the project by hand in Xcode instead, README.md lists exactly what to
# set.

name: M32Config

options:
  bundleIdPrefix: cc.kraml
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  M32Config:
    type: application
    platform: iOS

    sources:
      - path: Sources
      # A FOLDER reference, not a group: the bundle then contains a real "Web"
      # directory, which is what Bundle.main.url(..., subdirectory: "Web")
      # in BundleWeb looks for.
      - path: Resources/Web
        type: folder
      # Apple's privacy manifest, required for App Store submission and checked
      # at upload. Must sit at the bundle root, so it is a plain resource file
      # rather than part of the Web folder reference.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # App icon. A single 1024x1024 source is enough since Xcode 14 -- actool
      # derives every other size from it. AppIcon.svg beside it is what that PNG
      # was rendered from; see README.
      - path: Resources/Assets.xcassets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.kraml.m32config
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Swift 5 language mode on purpose: Swift 6 strict concurrency turns the
        # CoreBluetooth delegate pattern into a fight that buys this app nothing.
        SWIFT_VERSION: "5.0"
        # iPhone only. Declaring iPad support would oblige a second full set of
        # 13-inch screenshots for the store listing, for a layout nobody has
        # designed for the iPad. It still runs on an iPad in iPhone
        # compatibility mode; change back to "1,2" to support it properly.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # DEVELOPMENT_TEAM deliberately lives in Local.xcconfig, not here: a
        # Team ID identifies a specific developer account and this repo is
        # public, and keeping it out of the generated project is what stops
        # `xcodegen generate` from wiping your signing selection every time.

    # Read at BUILD time by Xcode, so regenerating the project cannot lose it.
    # Git-ignored; copy Local.xcconfig.example if you do not have one yet.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig

    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: M32 Config
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required since iOS 13 — without it the app is killed the moment it
        # first touches CoreBluetooth.
        # Answered here so App Store Connect stops asking on every single
        # upload. The app implements no encryption of its own, and the BLE link
        # is unencrypted (the firmware uses no bonding), so there is nothing
        # non-exempt to declare. Revisit if that ever changes.
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription:
          M32 Config uses Bluetooth to connect to your Morserino-32 and read or
          change its settings.
