<!--
  App icon source. Derived from the Morserino M32 wordmark (M32c.svg, the "M"
  with superscript 32, set in Skia Bold and converted to outlines - so there is
  no font dependency and it scales losslessly).

  Three things were done to turn the logo into a legal iOS icon, and all three
  matter if this is ever regenerated:
    * opaque background - iOS rejects an app icon with an alpha channel;
    * the 265.83x200 mark centred in a square with a ~12% margin, because
      Apple masks the corners and artwork must not run to the edge;
    * recoloured white by rewriting fill:#000000 in the group's style
      attribute - an inherited fill on a wrapper does NOT override it.

  Regenerate AppIcon-1024.png from this file with:
    qlmanage -t -s 1024 -o . AppIcon.svg
    ffmpeg -i AppIcon.svg.png -pix_fmt rgb24 \
        Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
  The ffmpeg step is what strips the alpha channel; without it the build fails
  asset compilation.
-->
