; BLE keyboard test host (TODO I2): runs on a classic M32 / Heltec WiFi LoRa 32 V2, connects to a Morserino's
; "Morserino32 Keyboard" like a computer would, and reports every HID input report and disconnect over USB.
; Driven by ../soak.py. NOT Morserino firmware - re-flash the M32 firmware afterwards.
;   pio run -d Software/tests/ble-kbd/central -t upload --upload-port /dev/cu.usbserial-0001
[env:host]
platform = espressif32@~6.11.0
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
build_flags = -D CORE_DEBUG_LEVEL=0
